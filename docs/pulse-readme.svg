<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" role="img" aria-label="Apostl Pulse SDK">
  <title>Apostl Pulse SDK</title>
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

      * { box-sizing: border-box; }

      .font-sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* Slow, meditative resting heartbeat breathing */
      @keyframes calm-breathe {
        0%, 100% { opacity: 0.15; transform: scale(0.96); }
        50% { opacity: 0.40; transform: scale(1.05); }
      }

      /* Pristine optical light transit */
      @keyframes light-transit {
        0% { stroke-dashoffset: 720; }
        100% { stroke-dashoffset: -720; }
      }

      /* Subdued terminal cursor */
      @keyframes calm-cursor {
        0%, 48% { opacity: 1; }
        50%, 98% { opacity: 0; }
      }

      /* Restrained gold core pulse */
      @keyframes gold-rest {
        0%, 100% { fill: #cca860; opacity: 0.9; }
        50% { fill: #e8c058; opacity: 1; filter: drop-shadow(0 0 3px rgba(232, 192, 88, 0.6)); }
      }

      .calm-aura {
        transform-origin: 400px 68px;
        animation: calm-breathe 6s ease-in-out infinite;
      }

      .light-filament {
        stroke-dasharray: 100 620;
        animation: light-transit 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .light-lead {
        stroke-dasharray: 40 680;
        animation: light-transit 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .cursor {
        animation: calm-cursor 1.1s step-end infinite;
      }

      .core-dot {
        animation: gold-rest 5s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .calm-aura, .light-filament, .light-lead, .cursor, .core-dot {
          animation: none;
        }
      }
    ]]></style>

    <!-- Gradients & Optics -->
    <linearGradient id="top-edge-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cca860" stop-opacity="0"/>
      <stop offset="35%" stop-color="#cca860" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#cca860" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#cca860" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#cca860" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="divider-rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141414" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gold-transit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cca860" stop-opacity="0"/>
      <stop offset="60%" stop-color="#cca860" stop-opacity="0.6"/>
      <stop offset="90%" stop-color="#e8c058" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="center-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cca860" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#cca860" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Faint 48px Blueprint Grid -->
    <pattern id="faint-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.016"/>
    </pattern>

    <mask id="canvas-mask">
      <rect width="800" height="200" fill="url(#vignette)"/>
    </mask>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="photon-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur stdDeviation="8" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas (#080808) with 8px Radius -->
  <rect width="800" height="200" rx="8" fill="#080808" stroke="#1c1c1c" stroke-width="1"/>

  <!-- Faint Neutral Grid with Soft Vignette -->
  <rect width="800" height="200" fill="url(#faint-grid)" mask="url(#canvas-mask)"/>

  <!-- Symmetrical Centered Top Accent Rail (1px Hairline) -->
  <line x1="300" y1="0" x2="500" y2="0" stroke="url(#top-edge-glow)" stroke-width="1.5"/>

  <!-- Quiet Atmospheric Glow behind Mark & Brand -->
  <circle cx="400" cy="68" r="110" fill="url(#center-aura)" class="calm-aura"/>

  <!-- ==================== OFFICIAL APOSTL BRAND LOCKUP ==================== -->
  <!-- Perfectly centered at X=400, Y=68 -->
  <g id="brand-group">
    <!-- Apostl Mark: Normalized Bounds 254x258 scaled to 25.4x25.8px, Top at Y=56 -->
    <g transform="translate(330, 56)">
      <g transform="scale(0.10) translate(-129, -127)">
        <path d="M129 385 L220 127 L270 127 L179 385 Z" fill="#fafafa"/>
        <path d="M292 127 L383 385 L333 385 L242 127 Z" fill="#fafafa"/>
        <circle cx="256" cy="341" r="23" class="core-dot"/>
      </g>
    </g>

    <!-- Official Brand Wordmark 'APOSTL' in Inter 24px/600, baseline at Y=77 -->
    <text x="368" y="77" class="font-sans" font-size="24" font-weight="600" fill="#fafafa" letter-spacing="-0.2px">APOSTL</text>
  </g>

  <!-- ==================== THE LIVING FILAMENT (ECG PULSE) ==================== -->
  <g transform="translate(0, 124)">
    <!-- Base 1px Hairline with Clear Continuous Geometry -->
    <path d="M 100 0 
             L 355 0 
             L 368 -2.5 
             L 377 2.5 
             L 386 0 
             L 395 0 
             L 402 -10 
             L 408 11 
             L 413 -5 
             L 418 0 
             L 426 0 
             L 433 -2.5 
             L 440 2.5 
             L 448 0 
             L 700 0" 
          fill="none" 
          stroke="url(#divider-rail)" 
          stroke-width="1.2" 
          stroke-linejoin="round"/>

    <!-- High-Luminance Gold Laser Stream -->
    <path d="M 100 0 
             L 355 0 
             L 368 -2.5 
             L 377 2.5 
             L 386 0 
             L 395 0 
             L 402 -10 
             L 408 11 
             L 413 -5 
             L 418 0 
             L 426 0 
             L 433 -2.5 
             L 440 2.5 
             L 448 0 
             L 700 0" 
          fill="none" 
          stroke="url(#gold-transit)" 
          stroke-width="1.6" 
          stroke-linejoin="round"
          class="light-filament"
          filter="url(#subtle-glow)"/>

    <!-- Bright White Photon Apex Head -->
    <path d="M 100 0 
             L 355 0 
             L 368 -2.5 
             L 377 2.5 
             L 386 0 
             L 395 0 
             L 402 -10 
             L 408 11 
             L 413 -5 
             L 418 0 
             L 426 0 
             L 433 -2.5 
             L 440 2.5 
             L 448 0 
             L 700 0" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2" 
          stroke-linejoin="round"
          class="light-lead"
          filter="url(#photon-bloom)"/>
  </g>

  <!-- ==================== SUBDUED MONOSPACE INSTALL PROMPT ==================== -->
  <g transform="translate(400, 164)" text-anchor="middle">
    <text class="font-mono" font-size="12" fill="#71706e" letter-spacing="0.3">
      <tspan fill="#bda06a">$</tspan> npm i @apostl-dev/pulse-sdk<tspan class="cursor" fill="#cca860"> ▋</tspan>
    </text>
  </g>
</svg>
