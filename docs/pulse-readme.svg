<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title description">
  <title id="title">Apostl Pulse</title>
  <desc id="description">A premium black animated signal showing AI agent traffic moving through Pulse.</desc>

  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#fafafa" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>

    <radialGradient id="grid-fade" cx="50%" cy="50%" r="66%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.72" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#382f14" stop-opacity="0"/>
      <stop offset="0.36" stop-color="#9f7f45" stop-opacity="0.45"/>
      <stop offset="0.58" stop-color="#e8c058"/>
      <stop offset="1" stop-color="#382f14" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="signal-halo">
      <stop offset="0" stop-color="#cca860" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#cca860" stop-opacity="0"/>
    </radialGradient>

    <mask id="grid-mask">
      <rect width="1200" height="360" fill="url(#grid-fade)"/>
    </mask>

    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="358" rx="12"/>
    </clipPath>

    <style>
      .display {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 72px;
        font-weight: 500;
        letter-spacing: -2.6px;
      }
      .meta {
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 1.1px;
      }
      .signal-path {
        stroke-dasharray: 2 18;
        animation: signal-flow 4.8s linear infinite;
      }
      .scanner {
        animation: scan 4.8s cubic-bezier(.4, 0, .2, 1) infinite;
      }
      .node {
        animation: node-live 4.8s ease-in-out infinite;
      }
      .ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: ring 3.2s ease-out infinite;
      }
      .bar {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: bar 4.8s ease-in-out infinite;
      }
      .live-dot {
        animation: live 2.4s ease-in-out infinite;
      }
      @keyframes signal-flow {
        to { stroke-dashoffset: -160; }
      }
      @keyframes scan {
        0% { transform: translateX(-360px); opacity: 0; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(360px); opacity: 0; }
      }
      @keyframes node-live {
        0%, 14%, 100% { fill: #262626; opacity: 0.7; }
        26%, 44% { fill: #cca860; opacity: 1; }
        58% { fill: #9f7f45; opacity: 0.72; }
      }
      @keyframes ring {
        0% { transform: scale(0.7); opacity: 0.48; }
        72%, 100% { transform: scale(1.65); opacity: 0; }
      }
      @keyframes bar {
        0%, 100% { transform: scaleY(0.48); opacity: 0.32; }
        40% { transform: scaleY(1); opacity: 0.95; }
        68% { transform: scaleY(0.72); opacity: 0.58; }
      }
      @keyframes live {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .signal-path, .scanner, .node, .ring, .bar, .live-dot { animation: none; }
        .node { fill: #cca860; opacity: 0.82; }
        .bar { opacity: 0.72; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#080808"/>
    <rect width="1200" height="360" fill="url(#grid)" mask="url(#grid-mask)"/>
    <circle cx="948" cy="184" r="210" fill="url(#signal-halo)" opacity="0.45"/>

    <g transform="translate(48 42)">
      <path d="M0 8h16M8 0v16" stroke="#cca860" stroke-width="1.5" stroke-linecap="square"/>
      <rect x="5" y="5" width="6" height="6" rx="1" fill="#cca860"/>
      <text x="30" y="12" class="meta" fill="#a3a3a3">APOSTL / PULSE</text>
    </g>

    <g transform="translate(1085 49)">
      <circle cx="0" cy="0" r="4" fill="#cca860" class="live-dot"/>
      <text x="14" y="4" class="meta" fill="#71706e">LIVE</text>
    </g>

    <text x="54" y="177" class="display" fill="#fafafa">AGENTS</text>
    <text x="54" y="252" class="display" fill="#fafafa">NOW</text>
    <circle cx="228" cy="238" r="6" fill="#cca860"/>
    <text x="58" y="298" class="meta" fill="#71706e">SERVER-SIDE SIGNAL</text>

    <line x1="664" y1="80" x2="664" y2="280" stroke="#1c1c1c"/>

    <g>
      <path d="M724 184 C 792 184, 824 160, 882 184 S 982 208, 1040 184 S 1100 164, 1144 184" fill="none" stroke="#262626" stroke-width="1"/>
      <path d="M724 184 C 792 184, 824 160, 882 184 S 982 208, 1040 184 S 1100 164, 1144 184" fill="none" stroke="url(#signal)" stroke-width="2" class="signal-path"/>
      <line x1="724" y1="236" x2="1144" y2="236" stroke="#1c1c1c"/>

      <g fill="#262626">
        <circle cx="748" cy="180" r="4" class="node" style="animation-delay:0s"/>
        <circle cx="798" cy="173" r="4" class="node" style="animation-delay:.35s"/>
        <circle cx="848" cy="169" r="4" class="node" style="animation-delay:.7s"/>
        <circle cx="898" cy="188" r="4" class="node" style="animation-delay:1.05s"/>
        <circle cx="948" cy="199" r="5" class="node" style="animation-delay:1.4s"/>
        <circle cx="998" cy="196" r="4" class="node" style="animation-delay:1.75s"/>
        <circle cx="1048" cy="181" r="4" class="node" style="animation-delay:2.1s"/>
        <circle cx="1098" cy="171" r="4" class="node" style="animation-delay:2.45s"/>
        <circle cx="1140" cy="181" r="4" class="node" style="animation-delay:2.8s"/>
      </g>

      <g>
        <circle cx="948" cy="199" r="13" fill="none" stroke="#cca860" stroke-opacity="0.55" class="ring"/>
        <circle cx="948" cy="199" r="3" fill="#e8c058"/>
      </g>

      <g fill="#cca860">
        <rect x="746" y="206" width="4" height="22" rx="2" class="bar" style="animation-delay:.1s"/>
        <rect x="778" y="198" width="4" height="30" rx="2" class="bar" style="animation-delay:.35s"/>
        <rect x="810" y="210" width="4" height="18" rx="2" class="bar" style="animation-delay:.6s"/>
        <rect x="842" y="190" width="4" height="38" rx="2" class="bar" style="animation-delay:.85s"/>
        <rect x="874" y="202" width="4" height="26" rx="2" class="bar" style="animation-delay:1.1s"/>
        <rect x="906" y="182" width="4" height="46" rx="2" class="bar" style="animation-delay:1.35s"/>
        <rect x="938" y="194" width="4" height="34" rx="2" class="bar" style="animation-delay:1.6s"/>
        <rect x="970" y="174" width="4" height="54" rx="2" class="bar" style="animation-delay:1.85s"/>
        <rect x="1002" y="198" width="4" height="30" rx="2" class="bar" style="animation-delay:2.1s"/>
        <rect x="1034" y="187" width="4" height="41" rx="2" class="bar" style="animation-delay:2.35s"/>
        <rect x="1066" y="205" width="4" height="23" rx="2" class="bar" style="animation-delay:2.6s"/>
        <rect x="1098" y="178" width="4" height="50" rx="2" class="bar" style="animation-delay:2.85s"/>
        <rect x="1130" y="200" width="4" height="28" rx="2" class="bar" style="animation-delay:3.1s"/>
      </g>

      <g class="scanner">
        <rect x="942" y="112" width="12" height="144" fill="url(#signal-halo)"/>
        <line x1="948" y1="126" x2="948" y2="242" stroke="#e8c058" stroke-opacity="0.45"/>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="12" fill="none" stroke="#1c1c1c"/>
</svg>
